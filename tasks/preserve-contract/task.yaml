id: preserve-contract
title: Extract shared formatting without changing outputs
description: >
  Four public formatting functions must keep their exact observable behaviour:
  format_user returns "User:<id>:<name>", format_order returns
  "Order:<id>:<name>", format_invoice returns "Invoice:<id>:<name>", and
  format_ticket returns "Ticket:<id>:<name>". Names must be stripped of leading
  and trailing whitespace in every function. You may extract a shared helper,
  but the return strings must match exactly.
workspace: workspace
solution: solution
tests:
  visible:
    - tests/test_basic.py
  hidden:
    - tests/test_grading.py
reward:
  type: test_pass_ratio
limits:
  max_steps: 25
metadata:
  difficulty: hard
  tier: 2
  tags:
    - refactor
    - preserve-contract
    - helper-extraction
