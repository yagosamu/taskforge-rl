[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskforge"
version = "0.1.0"
description = "Verifiable RL environments for coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
]

[project.scripts]
taskforge = "taskforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["taskforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
