id: fix-api-404
title: Return 404 for missing API records
description: >
  The API handler returns 200 with the record when it exists. When the
  requested record does not exist, it must return status 404 and the body
  {"error": "not found"}.
workspace: workspace
tests:
  visible:
    - tests/test_basic.py
  hidden:
    - tests/test_grading.py
reward:
  type: test_pass_ratio
  partial_credit: false
budget:
  test_timeout_s: 10
limits:
  max_steps: 25
metadata:
  difficulty: medium
  tags:
    - api
    - status-code
